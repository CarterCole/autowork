# autowork.conf: which queue this checkout works, and that queue's rules.
#
# Plain KEY=value lines, one per line, no quotes, no inline comments.
# bin/aw reads this file; it is never executed.
#
# Starting your own queue from a copy of this repo? Do not edit by hand:
# run `bin/aw init` and it re-points everything at your repo and your login.

# The GitHub repo whose issues are the queue.
QUEUE_REPO=CarterCole/autowork

# GitHub logins allowed to author work items and judge submissions.
# An issue is a work item only if one of these people opened it AND it carries
# the `approved` label. Separate several logins with commas.
MAINTAINERS=neopunisher

# Copies requested when a work item does not say (its "### Copies" section).
DEFAULT_COPIES=1

# Upper bound on copies. GitHub allows at most 10 assignees per issue.
MAX_COPIES=10

# A claim with no open pull request expires after this many hours.
CLAIM_TTL_HOURS=24

# How many items one worker may be working on (claimed, not yet submitted).
MAX_ACTIVE_CLAIMS=2

# Size limits for one submission folder (work/<issue>/).
MAX_FILES=200
MAX_TOTAL_KB=5120
